<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | QuickCartPOS</title>
    <link rel="stylesheet" href="/styles/index.css">
</head>
<body>
    <div class="auth-shell">
        <div class="auth-panel">
            <div class="auth-form" style="flex:1 1 100%;">
                <div class="auth-form-inner">
                    <h1>Forgot Password</h1>

                    <% if (sent) { %>
                        <div class="alert alert-success">
                            If that email has an account, a password reset link is on its way. It'll expire in 1 hour.
                        </div>
                        <p class="auth-footnote"><a href="/login">← Back to login</a></p>
                    <% } else { %>
                        <p class="muted" style="font-size:0.9rem;">Enter the email you registered with and we'll send you a link to reset your password.</p>
                        <form action="/forgot-password" method="post">
                            <input type="hidden" name="_csrf" value="<%= csrfToken %>">
                            <input type="email" name="email" placeholder="Your Email" required autocomplete="email">
                            <button type="submit">Send reset link</button>
                        </form>
                        <p class="auth-footnote"><a href="/login">← Back to login</a></p>
                    <% } %>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
