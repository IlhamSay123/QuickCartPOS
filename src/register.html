<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | QuickCartPOS</title>
    <link rel="stylesheet" href="/styles/index.css">
</head>
<body>
    <div class="auth-shell">
        <div class="auth-panel">
            <div class="auth-form">
                <div class="auth-form-inner">
                    <h1>Sign Up</h1>
                    <form action="/register" method="post">
                        <input type="hidden" name="_csrf" value="<%= csrfToken %>">
                        <input type="text" name="name" placeholder="Your Name" required>
                        <input type="email" name="email" placeholder="Your Email" required autocomplete="email">
                        <input type="password" name="password" placeholder="Password" id="pass1" required
                               minlength="8"
                               onkeyup="{if(this.value !== document.getElementById('pass2').value)
                               {document.getElementById('error').innerHTML = 'Password doesn\'t Match';
                               document.getElementById('submit').disabled=true;}else
                               {document.getElementById('error').innerHTML = '';
                               document.getElementById('submit').disabled=false;};}" autocomplete="new-password"/>
                        <input type="password" name="password-repeat" placeholder="Repeat Your Password" id="pass2" required
                               minlength="8"
                               onkeyup="{if(this.value !== document.getElementById('pass1').value)
                               {document.getElementById('error').innerHTML = 'Password doesn\'t Match';
                               document.getElementById('submit').disabled=true;}else
                               {document.getElementById('error').innerHTML = '';
                               document.getElementById('submit').disabled=false;};}" autocomplete="new-password" />
                        <p class="muted" style="font-size:0.78rem; margin:-0.1rem 0 0.5rem;">At least 8 characters, with a letter and a number.</p>
                        <div id="error"></div>
                        <div class="terms-row">
                            <input type="checkbox" name="terms" id="terms-conditions-input" required>
                            <label for="terms-conditions-input" style="margin:0;">I agree to all statements in <a href="#">Terms of service</a></label>
                        </div>
                        <button type="submit" name="submit" id="submit">Register</button>
                    </form>
                    <p class="auth-footnote">Already have an account? <a href="/login">Login</a></p>
                </div>
            </div>
            <div class="auth-art">
                <img src="/images/signup-image.jpg" alt="Register illustration">
            </div>
        </div>
    </div>
    <script>
        document.getElementById('error').innerHTML = '';
    </script>
</body>
</html>
