<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Sale | QuickCartPOS</title>
  <link rel="stylesheet" href="/styles/index.css">
</head>
<body>
  <%- include('partials/nav.html') %>

  <main class="container">
    <h1>Add a Sale</h1>
    <p class="muted">Logging a sale as it happens — for bringing in past history instead, use <a href="/import-sales">Import Sales</a>.</p>

    <form action="/add-sale" method="POST" class="form-card">
      <input type="hidden" name="_csrf" value="<%= csrfToken %>">
      <label for="date">Date</label>
      <input type="date" name="date" required>

      <label for="category">Product Category</label>
      <select name="category" required>
        <option value="Electronics">Electronics</option>
        <option value="Home">Home</option>
        <option value="Apparel">Apparel</option>
        <option value="Other">Other</option>
      </select>

      <label for="quantity">Quantity</label>
      <input type="number" name="quantity" step="1" min="1" required>

      <label for="price">Price per Unit (£)</label>
      <input type="number" name="price" step="0.01" min="0" required>

      <label for="age">Customer Age (optional)</label>
      <input type="number" name="age" min="0" placeholder="e.g. 30">

      <button type="submit">Submit Sale</button>
    </form>

    <div class="text-center mt-4">
      <a href="/all-sales" class="btn btn-outline">📋 View All Sales</a>
      <a href="/import-sales" class="btn btn-outline">📤 Import Sales (CSV)</a>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 QuickCartPOS</p>
  </footer>
</body>
</html>
