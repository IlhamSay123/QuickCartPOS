<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | QuickCartPOS</title>
    <link rel="stylesheet" href="/styles/index.css">
</head>
<body>
    <div class="auth-shell">
        <div class="auth-panel">
            <div class="auth-form" style="flex:1 1 100%;">
                <div class="auth-form-inner">
                    <h1>Reset Password</h1>

                    <% if (invalid) { %>
                        <div class="alert alert-danger">
                            This reset link is invalid or has expired.
                        </div>
                        <p class="auth-footnote"><a href="/forgot-password">Request a new link</a></p>
                    <% } else { %>
                        <% if (error) { %>
                            <div class="alert alert-danger"><%= error %></div>
                        <% } %>
                        <form action="/reset-password/<%= token %>" method="post">
                            <input type="hidden" name="_csrf" value="<%= csrfToken %>">
                            <input type="password" name="password" placeholder="New password" required minlength="8" autocomplete="new-password">
                            <p class="muted" style="font-size:0.78rem; margin:-0.1rem 0 0.5rem;">At least 8 characters, with a letter and a number.</p>
                            <button type="submit">Set new password</button>
                        </form>
                    <% } %>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
