<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | QuickCartPOS</title>
    <link rel="stylesheet" href="/styles/index.css">
</head>
<body>
    <div class="auth-shell">
        <div class="auth-panel">
            <div class="auth-art">
                <img src="/images/signin-image.jpg" alt="Login illustration">
            </div>
            <div class="auth-form">
                <div class="auth-form-inner">
                    <h1>Log In</h1>
                    <form action="/login" method="post">
                        <input type="hidden" name="_csrf" value="<%= csrfToken %>">
                        <input type="email" name="email" placeholder="Your Email" required>
                        <input type="password" name="password" placeholder="Password" required>
                        <button type="submit">Login</button>
                    </form>
                    <p class="auth-footnote"><a href="/forgot-password">Forgot your password?</a></p>
                    <p class="auth-footnote">Don't have an account? <a href="/register">Register</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
