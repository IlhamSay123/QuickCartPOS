<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Overview | QuickCartPOS</title>
  <link rel="stylesheet" href="/styles/index.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <%- include('partials/nav.html') %>

  <main class="container">
    <h1>Sales Overview</h1>

    <div class="card" style="margin-bottom:1.5rem;">
      <h2 style="font-size:1rem; text-align:center; margin-bottom:1rem;">All-Year Stats</h2>
      <div class="stat-grid">
        <div class="stat"><h6>Total Revenue</h6><p id="total-revenue">Loading...</p></div>
        <div class="stat"><h6>Revenue Growth Rate</h6><p id="growth-rate">Loading...</p></div>
        <div class="stat"><h6>Units Sold</h6><p id="units-sold">Loading...</p></div>
        <div class="stat"><h6>Average Order Value</h6><p id="aov">Loading...</p></div>
        <div class="stat"><h6>Peak Sales Month</h6><p id="peak-month">Loading...</p></div>
      </div>
    </div>

    <div class="chart-container">
      <h2>Revenue Over Time</h2>
      <canvas id="revenue-chart" height="100"></canvas>
    </div>

    <div class="chart-container">
      <h2>Units Sold Over Time</h2>
      <canvas id="units-chart" height="100"></canvas>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 QuickCartPOS</p>
  </footer>

  <script src="/script/salesOverview.js"></script>
</body>
</html>
